<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Play</title>
    <style>
    body {
      background-color: rgb(25,25,25);
      color: white;
      font-family: Arial;
    }
    .title {
      font-size: 30px;
      font-weight: bold;
    }

    .move-icon {
      height: 50px;
    }

    .move-button {
      background-color: transparent;
      border: 3px solid white;
      width: 120px;
      height: 120px;
      border-radius:60px;
      margin-right:10px;
      cursor:pointer;
    }
  </style>
  </head>

  <body>
    <p>Rock Paper Scissors</p>
    <button class="move-button" onclick="play('Rock')"><img src="image/rock-emoji.png" class="move-icon" ></button>
    <button class="move-button" onclick="play('Paper')"><img src="image/paper-emoji.png" class="move-icon" ></button>
    <button class="move-button" onclick="play('Scissors')"><img src="image/scissors-emoji.png" class="move-icon" ></button>
    <button onclick="scores.win = 0, scores.lose = 0, scores.tie = 0; localStorage.removeItem('scores')">Reset</button>
    <script>

      const scores = JSON.parse(localStorage.getItem('score'));
      if (scores=== null) {
        scores = {
          win:0,
          lose:0,
          tie:0
        };
      }
      
      function play(playerMove){
        const random = Math.random();
        let computerMove ='';
        // Determine the computer's move
        if (random >=0 && random <1/3){
          computerMove = 'Rock';
        }else if (random >=1/3 && random <2/3){
          computerMove = 'Paper';

        }else {
          computerMove ='Scissors';
        }
        //2. compare moves to find the winner
        let outcome = '';
        if (playerMove === computerMove){
          outcome = "It's a tie!";
          scores.tie  +=1;
        }
        else if (
          (playerMove === 'Rock' && computerMove === 'Scissors')||
          (playerMove === 'Paper' && computerMove === 'Rock') ||
          (playerMove === 'Scissors' && computerMove === 'Paper')

        ){
          outcome = 'You win!';
          scores.win  +=1;
        }
        else{
          outcome = 'You lose!';
          scores.lose  +=1;
        }

        localStorage.setItem('score', JSON.stringify(scores));

        alert(`You picked ${playerMove} and Computer picked ${computerMove}. ${outcome}   
        wins${scores.win}, lose ${scores.lose}, tie ${scores.tie}`);
       

      }
    </script>
  </body>
</html>
